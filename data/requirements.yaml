# HPU-200 unit controller, software requirements (fictional, written for this project).
# ambiguous / issues are the reviewer's labels, used only to evaluate the quality checker.
- id: REQ-001
  text: When the start push button is pressed and no fault is active, the controller shall close the motor contactor K1 within 500 ms.
- id: REQ-002
  text: When the stop push button is pressed, the controller shall open the motor contactor K1 within 200 ms.
- id: REQ-003
  text: When the emergency stop is activated, the controller shall open the motor contactor K1 within 100 ms and set fault code E01.
- id: REQ-004
  text: When the system pressure exceeds 240 bar for more than 2 s, the controller shall open the motor contactor K1 and set fault code E12.
- id: REQ-005
  text: When the system pressure is below 150 bar for more than 10 s while the motor is running, the controller shall raise warning W03.
- id: REQ-006
  text: When the fluid temperature exceeds 70 °C, the controller shall open the motor contactor K1 and set fault code E34.
- id: REQ-007
  text: When the fluid temperature exceeds 45 °C, the controller shall start the cooler fan.
- id: REQ-008
  text: When the fluid temperature is below 40 °C, the controller shall stop the cooler fan.
- id: REQ-009
  text: When the low level switch opens, the controller shall open the motor contactor K1 within 1000 ms and set fault code E40.
- id: REQ-010
  text: When the pressure transmitter signal is below 3.6 mA, the controller shall set fault code E21.
- id: REQ-011
  text: When the pressure transmitter signal exceeds 21 mA, the controller shall set fault code E21.
- id: REQ-012
  text: If a phase loss is detected, then the controller shall set fault code E05.
- id: REQ-013
  text: While a fault is active, the controller shall keep the motor contactor K1 open.
- id: REQ-014
  text: When the reset push button is pressed and the fault condition has cleared, the controller shall clear the active faults.
- id: REQ-015
  text: When the fluid temperature is below 10 °C, the controller shall raise warning W07 and inhibit the motor start.
- id: REQ-016
  text: When the operating hours since the last filter change exceed 500 h, the controller shall raise warning W20.
- id: REQ-017
  text: When the motor current exceeds 32 A for more than 5 s, the controller shall open the motor contactor K1 and set fault code E07.
- id: REQ-018
  text: When a fault code is set, the controller shall write the fault code and a time stamp to the fault log.
- id: REQ-019
  text: When the fluid temperature exceeds 60 °C, the controller shall raise warning W30.
- id: REQ-020
  text: When the system pressure exceeds 230 bar, the controller shall raise warning W11.
- id: REQ-021
  text: The controller shall respond quickly to operator commands.
